name: Uravu Smoke Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-v2.js
          node --check auth.js
          node --check tests/relationship-smoke.cjs
      - name: Run app smoke checks
        run: node tests/relationship-smoke.cjs
